name: CI/CD Pipeline for Django to Azure

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. PRUEBAS Y ANÁLISIS ESTÁTICO
  # ==========================================
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8

      - name: Run Django Tests
        # Usamos el test runner nativo de Django en lugar de pytest por defecto
        run: |
          python manage.py test 

  # ==========================================
  # 2. CONSTRUCCIÓN DEL ARTEFACTO (Producción)
  # ==========================================
  build:
    runs-on: ubuntu-latest
    needs: static-analysis
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !venv/
            !.venv/
            !.git/
            !__pycache__/
            !db.sqlite3       # CRÍTICO: Evita sobrescribir los datos de producción
            !staticfiles/     # Azure generará estos archivos en el servidor
            !media/           # Evita subir archivos multimedia locales

  # ==========================================
  # 3. DESPLIEGUE EN AZURE
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
      
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'topicos' # REEMPLAZA ESTO
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .